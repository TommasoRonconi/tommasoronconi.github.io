<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Page not found">
  <!-- Palette: Dracula — bg #282a36, line #44475a, comment #6272a4, fg #f8f8f2,
       purple #bd93f9, cyan #8be9fd, orange #ffb86c, yellow #f1fa8c -->

  <!-- card background -->
  <rect x="4" y="4" width="1192" height="667" rx="36" fill="#282a36" stroke="#44475a" stroke-width="4"/>

  <!-- scattered stars -->
  <g fill="#8be9fd">
    <circle cx="150" cy="120" r="5"/>
    <circle cx="1060" cy="100" r="4"/>
    <circle cx="940" cy="210" r="3.5"/>
    <circle cx="230" cy="250" r="3"/>
    <circle cx="1120" cy="330" r="3.5"/>
    <circle cx="90" cy="400" r="3"/>
    <path d="M330 100 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
  </g>
  <g fill="#f1fa8c">
    <path d="M180 320 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
    <path d="M1010 400 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 z"/>
    <path d="M1080 190 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
  </g>

  <!-- big 404: digits in slate, the zero is a ringed planet -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="300" fill="#6272a4">
    <text x="330" y="360" text-anchor="middle">4</text>
    <text x="870" y="360" text-anchor="middle">4</text>
  </g>
  <!-- planet as the zero -->
  <g transform="translate(600,255)">
    <ellipse cx="0" cy="0" rx="185" ry="52" fill="none" stroke="#8be9fd" stroke-width="16" stroke-linecap="round" opacity="0.45" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="105" fill="#bd93f9"/>
    <circle cx="-36" cy="-24" r="20" fill="#d6bcfa"/>
    <circle cx="32" cy="30" r="13" fill="#d6bcfa"/>
    <circle cx="40" cy="-40" r="9" fill="#d6bcfa"/>
    <path d="M-185 52 A 185 52 0 0 0 185 -52" fill="none" stroke="#8be9fd" stroke-width="16" stroke-linecap="round" transform="rotate(-16)"/>
  </g>

  <!-- ground hills -->
  <path d="M4 560 Q 300 500 620 555 T 1196 545 L 1196 635 Q 1196 671 1160 671 L 40 671 Q 4 671 4 635 Z" fill="#44475a"/>
  <path d="M4 600 Q 250 560 520 600 T 1196 590 L 1196 635 Q 1196 671 1160 671 L 40 671 Q 4 671 4 635 Z" fill="#3b3e50"/>

  <!-- little telescope searching the sky -->
  <g>
    <!-- soft search beam -->
    <path d="M262 520 L 150 300 L 260 380 Z" fill="#8be9fd" opacity="0.12"/>
    <!-- tripod -->
    <g stroke="#6272a4" stroke-width="12" stroke-linecap="round">
      <line x1="270" y1="520" x2="240" y2="580"/>
      <line x1="270" y1="520" x2="300" y2="580"/>
      <line x1="270" y1="520" x2="270" y2="585"/>
    </g>
    <!-- tube pointing up-left -->
    <g transform="translate(270,515) rotate(-125)">
      <rect x="-16" y="-20" width="110" height="40" rx="18" fill="#ffb86c"/>
      <rect x="78" y="-24" width="26" height="48" rx="12" fill="#e8a35a"/>
      <rect x="-24" y="-14" width="18" height="28" rx="8" fill="#e8a35a"/>
    </g>
    <!-- mount joint -->
    <circle cx="270" cy="516" r="12" fill="#f8f8f2"/>
  </g>

  <!-- cratered moon peeking on the right hill -->
  <g transform="translate(950,585)">
    <circle cx="0" cy="0" r="58" fill="#f1fa8c"/>
    <circle cx="-20" cy="-18" r="14" fill="#dce378"/>
    <circle cx="20" cy="8" r="9" fill="#dce378"/>
    <circle cx="-4" cy="24" r="5" fill="#dce378"/>
  </g>

  <!-- caption -->
  <text x="600" y="648" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#6272a4" text-anchor="middle">PAGE NOT FOUND</text>
</svg>
