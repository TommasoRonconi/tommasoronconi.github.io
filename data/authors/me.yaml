# ── Short bio shown under your name on the homepage ─────────────────────────
# Structural dual message: scientist AND software engineer AND team lead,
# stated through evidence rather than self-assessment.
bio: |
  Tommaso Ronconi is a researcher at the Italian ALMA Regional Center in Bologna, based
  at INAF's Institute of Radioastronomy, where he works as an HPC
  expert. His research spans galaxy formation and evolution and large-scale-
  structure cosmology for modern surveys and experiments (i.e. SKAO, Euclid, ET) — from panchromatic SED
  modelling and Bayesian inference to full-sky mock light-cones. He is the
  author and maintainer of several open-source scientific packages (GalaPy,
  SCAMPy, and contributions to T-RECS and CosmoBolognaLib), built on a C++/
  Python and high-performance-computing foundation. He currently leads the
  science-platform prototyping work package for the ESO ALMA support-centre
  development plan and has supervised three graduate students.

